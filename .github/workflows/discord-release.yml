name: Announce Release on Discord

on:
  release:
    types: [published] # Triggers whenever you publish a release or pre-release on GitHub
  workflow_dispatch:   # Manual re-send: Actions > Announce Release on Discord > Run workflow
    inputs:
      tag:
        description: "Release tag to announce (e.g. 26.10.1)"
        required: true

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Check out announcer script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Load release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh api "repos/${{ github.repository }}/releases/tags/${TAG}" > release.json

      - name: Send Discord Release Announcement
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 .github/scripts/discord_release.py release.json
