<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BC Tools</title>
<script>
  /* GitHub Pages has no server-side router, so a direct link or refresh on
     a path like /terms lands here. Stash the intended path and bounce back
     to "/", where index.html restores it via history.replaceState. */
  sessionStorage.setItem("bc-redirect-path", location.pathname + location.search + location.hash);
  location.replace("/");
</script>
</head>
<body></body>
</html>
