<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- BC Tools favicon — a tight, padded square crop of the nav bar's own
     "BC-Tools" bowtie mark (see the <img class="site-logo"> SVG in
     index.html), not the old rectangular og:image/favicon.png banner.
     The previous <link rel="icon"> was a 150x104 non-square SVG, which
     browsers/search engines can reject or ignore in favor of a generic
     placeholder icon.
     The bowtie mark itself is genuinely wide-and-short (two touching
     339x339 diamonds spanning ~663x339) — squaring the viewBox off its
     WIDTH (the first attempt) left the shape filling only ~44% of the
     frame's height, reading as tiny at tab-icon sizes next to squarer
     logos (e.g. GitHub's octocat). Squared off the shape's HEIGHT
     instead — a first pass at ~10% padding read as too tight/cropped
     next to a normal tab favicon (the diamonds' tips brushed the
     square's corners); ~30% was still a hair too tight in the actual
     browser tab (still a sliver cut off at the edges), so this settles
     at ~45% padding — comfortably inside the frame with real breathing
     room, still much bolder than the original width-based crop. -->
<svg width="256" height="256" viewBox="-9.19194946289062 -80.68908081054687 491.63389892578124 491.63389892578124" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <g transform="matrix(1,0,0,1,-1226.375,-755.633669)">
        <g transform="matrix(1,0,0,1,-1,-56.107618)">
            <g transform="matrix(0.707107,-0.707107,0.707107,0.707107,-636.536072,995.960995)">
                <path d="M1493.5,1248L1493.5,1466.5L1275,1466.5C1275,1345.826 1372.826,1248 1493.5,1248Z" style="fill:rgb(29,36,55);"/>
                <path d="M1504.125,1248L1504.125,1466.5L1493.5,1477.125L1275,1477.125L1264.375,1466.5C1264.375,1339.958 1366.958,1237.375 1493.5,1237.375L1504.125,1248ZM1493.5,1248C1372.826,1248 1275,1345.826 1275,1466.5L1493.5,1466.5L1493.5,1248Z" style="fill:rgb(212,219,238);"/>
            </g>
            <g transform="matrix(-0.707107,0.707107,-0.707107,-0.707107,3564.536072,957.777259)">
                <path d="M1493.5,1248L1493.5,1466.5L1275,1466.5C1275,1345.826 1372.826,1248 1493.5,1248Z" style="fill:rgb(212,219,238);"/>
                <path d="M1504.125,1248L1504.125,1466.5L1493.5,1477.125L1275,1477.125L1264.375,1466.5C1264.375,1339.958 1366.958,1237.375 1493.5,1237.375L1504.125,1248ZM1493.5,1248C1372.826,1248 1275,1345.826 1275,1466.5L1493.5,1466.5L1493.5,1248Z" style="fill:rgb(29,36,55);"/>
            </g>
        </g>
    </g>
</svg>
